<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/contacto.css ">
</head>
<body>
    <header></header>
    <main>
        <section>
            <form action="" class="row needs-validation" novalidate>
                <div>
                    <label for="nombre">Nombre y Apellido</label>
                    <input type="text" class="form-control"
                    id="nombre" required>
                </div>
                <div>
                    <label for="telefono">Telefono de contacto</label>
                    <input type="number" class="form-control"
                    id="telefono" required placeholder="Sin 0 ni 15">
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" class="form-control"
                    id="email" required placeholder="example@example.com">
                </div>
                <div>
                    <label for="consulta">Consultas o Sugerencias</label>
                    <textarea name="consulta" id="consulta" class="form-control" required placeholder="Dejanos tus dudas o sugeninos alguna peli o serie."></textarea>
                </div>
        

            </form>
        </section>
    </main>
    <footer></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
